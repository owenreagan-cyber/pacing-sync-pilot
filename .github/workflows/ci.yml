name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --reporter=verbose

  fpk-regression-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard: kl_custom_block_7 must never appear in source code
        run: |
          if grep -R -nF "kl_custom_block_7" src supabase api --exclude-dir=test --exclude-dir=tests --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "❌ Found forbidden token: kl_custom_block_7"
            exit 1
          fi

      - name: Guard: assignment deployer must keep on_paper submission type
        run: grep -nE "submission_types.*on_paper" supabase/functions/canvas-deploy-assignment/index.ts

      - name: Guard: gemini-2.5-flash must be fully eradicated
        run: |
          if grep -R -nF "gemini-2.5-flash" src supabase api; then
            echo "❌ Found forbidden model token: gemini-2.5-flash"
            exit 1
          fi
